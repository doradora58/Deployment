global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-management'
    static_configs:
      - targets: ['order-management:8080']

  - job_name: 'fms'
    static_configs:
      - targets: ['fms:8080']

  - job_name: 'raspberry-pi'
    static_configs:
      - targets: ['node-exporter:9100']