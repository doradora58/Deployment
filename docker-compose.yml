version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  mongo_data:

services:
  order-management:
    image: 192.168.1.148:5000/order-management:latest
    container_name: order-management
    restart: always
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FMS_API_URL=http://fms:8080/api/transportjob/create
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      - rabbitmq
    networks:
      - app-network

  fms:
    image: 192.168.1.148:5000/fms:latest
    container_name: fms
    restart: always
    ports:
      - "9020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - MongoDB__ConnectionString=mongodb://mongo:27017
      - MongoDB__DatabaseName=FmsDb
      - GoogleMaps__ApiKey=${GOOGLE_MAPS_API_KEY:?Set GOOGLE_MAPS_API_KEY in .env}
      - GoogleMaps__JavaScriptApiKey=${GOOGLE_MAPS_BROWSER_KEY:?Set GOOGLE_MAPS_BROWSER_KEY in .env}
      - Vda5050__Enabled=true
      - Vda5050__TopicRoot=uagv/v2
      - Vda5050__Broker__Host=rabbitmq
      - Vda5050__Broker__Port=1883
      - Vda5050__Broker__Username=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - Vda5050__Broker__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - Vda5050__Broker__UseTls=false
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - app-network

  auto-vehicle-emulator:
    image: ${REGISTRY_HOST:-192.168.1.148:5000}/auto-vehicle-emulator:latest
    container_name: auto-vehicle-emulator
    restart: always
    ports:
      - "9030:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - VehicleEmulator__Manufacturer=${VEHICLE_MANUFACTURER:-Example}
      - VehicleEmulator__SerialNumber=${VEHICLE_SERIAL_NUMBER:-AGV-001}
      - VehicleEmulator__TopicRoot=uagv/v2
      - VehicleEmulator__BrokerHost=rabbitmq
      - VehicleEmulator__BrokerPort=1883
      - VehicleEmulator__Username=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - VehicleEmulator__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - VehicleEmulator__UseTls=false
      - VehicleEmulator__PublishIntervalMilliseconds=${VEHICLE_PUBLISH_INTERVAL_MS:-2000}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - app-network
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    command:
      - sh
      - -c
      - rabbitmq-plugins enable --offline rabbitmq_mqtt && exec rabbitmq-server
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: fms-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s