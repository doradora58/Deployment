version: '3.8'

version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  order-management:
    image: 192.168.1.148:5000/order-management:latest
    container_name: order-management
    restart: always
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FMS_API_URL=http://fms:8080/api/dispatch
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network

  fms:
    image: 192.168.1.148:5000/fms:latest
    container_name: fms
    restart: always
    ports:
      - "9020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network

volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local