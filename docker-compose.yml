version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  order-management:
    image: localhost:5000/order-management:latest
    container_name: order-management
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FMS_API_URL=fms/api/dispatch
    networks:
      - app-network

  fms:
    image: localhost:5000/fms:latest
    container_name: fms
    restart: always
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - app-network