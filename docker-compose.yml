version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  order-management:
    image: 192.168.1.148:5000/order-management:latest
    container_name: order-management
    restart: always
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FMS_API_URL=fms/api/dispatch
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network

  fms:
    image: 192.168.1.148:5000/fms:latest
    container_name: fms
    restart: always
    ports:
      - "9020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-network